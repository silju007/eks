# Infra CI/CD for the EKS platform Terraform.
#
# Bitbucket only runs bitbucket-pipelines.yml from the REPOSITORY ROOT, so this
# file lives at the repository root and drives the Terraform under infra-terraform/
# via `make -C infra-terraform`.
#
# Scope: this pipeline only manages the AWS layer — the `global` (ECR/Route53/KMS)
# and `shared` (EKS cluster + one-time ArgoCD install) roots. It never runs
# `bootstrap`, which is a one-time, human-run step (it creates the very state
# bucket + KMS + CI role this pipeline depends on, and keeps LOCAL state).
# After `shared` applies, ArgoCD owns the cluster — day-2 platform/app changes go
# through the GitOps repo, not here.
#
# Auth: Bitbucket OIDC (no stored AWS keys). Each step requests `oidc: true`, then
# exchanges the step token for the CI role ONCE via `sts assume-role-with-web-
# identity` and exports STATIC session credentials (AWS_ACCESS_KEY_ID/…). Both the
# Terraform AWS provider AND the `aws eks get-token` exec plugin (used by the
# kubernetes/helm/kubectl providers in `shared`) then read the same env creds.
#
# Required repository variables (Repository settings -> Repository variables):
#   PROJECT      project folder under infra-terraform/projects/ (e.g. "example-project")
#   AWS_REGION   e.g. "us-east-1"
#   CI_ROLE_ARN  the `ci_role_arn` output from `make output ROOT=bootstrap`
#
# IMAGE: debian-slim (glibc). ci/install-tools.sh installs AWS CLI v2 + Terraform
# + make/jq each run — the Alpine `hashicorp/terraform` image can't run AWS CLI v2
# (musl) and its apk aws-cli(v1) is python/expat-broken. For faster runs, bake a
# custom image with these tools preinstalled and set it as `image:` below.
#
# SESSION LENGTH: assume-role-with-web-identity creds last up to the CI role's
# MaxSessionDuration (default 1h). A first-time `shared` apply (cluster + nodes +
# addons) normally finishes well under that; raise the role's max duration if a
# cold create ever runs long.

# Default: install tools at runtime on a plain debian base.
image: debian:bookworm-slim
#
# FASTER: after running the `build-ci-image` custom pipeline below once, switch
# to the baked image so ci/install-tools.sh becomes a near no-op. Replace the
# line above with (fill in your account id; region + repo match global's output
# `ci_image_repository_url`), using Bitbucket's native AWS OIDC pull auth:
#
# image:
#   name: ACCOUNT_ID.dkr.ecr.AWS_REGION.amazonaws.com/PROJECT-ci:latest
#   aws:
#     oidc-role: $CI_ROLE_ARN

definitions:
  steps:
    - step: &plan
        name: Terraform plan (global + shared)
        oidc: true
        script:
          - bash ci/install-tools.sh
          - export AWS_REGION="$AWS_REGION" AWS_DEFAULT_REGION="$AWS_REGION"
          # OIDC token -> static session creds used by both TF provider + aws CLI
          - |
            CREDS=$(aws sts assume-role-with-web-identity \
              --role-arn "$CI_ROLE_ARN" \
              --role-session-name "bb-${BITBUCKET_BUILD_NUMBER:-local}" \
              --web-identity-token "$BITBUCKET_STEP_OIDC_TOKEN" \
              --query Credentials --output json)
            export AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r .AccessKeyId)
            export AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r .SecretAccessKey)
            export AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r .SessionToken)
          - aws sts get-caller-identity
          # CI has no named AWS profile — blank it so the env creds are used
          - export EXTRA='-var=aws_profile='
          # ArgoCD private-repo SSH key. Stored BASE64-ENCODED in the secured var
          # because Bitbucket flattens newlines in variables, which corrupts the
          # PEM key (ArgoCD then reports "ssh: no key found"). Decode it here.
          # Empty -> no repo credential.
          - export TF_VAR_gitops_ssh_private_key="$(printf '%s' "${GITOPS_SSH_PRIVATE_KEY:-}" | base64 -d)"
          - make -C infra-terraform init PROJECT="$PROJECT" ROOT=global && make -C infra-terraform plan PROJECT="$PROJECT" ROOT=global EXTRA="$EXTRA"
          - make -C infra-terraform init PROJECT="$PROJECT" ROOT=shared && make -C infra-terraform plan PROJECT="$PROJECT" ROOT=shared EXTRA="$EXTRA"

pipelines:
  # Manually-run: build the baked CI image (ci/Dockerfile) and push it to the
  # ECR repo `global` created (<name_prefix>-ci). Run once, then re-run whenever
  # you bump TF_VERSION or the Dockerfile. Trigger from Pipelines -> Run pipeline
  # -> Custom: build-ci-image. Assumes PROJECT == name_prefix.
  custom:
    build-ci-image:
      - step:
          name: Build & push CI image to ECR
          oidc: true
          services:
            - docker
          script:
            - bash ci/install-tools.sh   # ensures aws cli is present (idempotent)
            - export AWS_REGION="$AWS_REGION" AWS_DEFAULT_REGION="$AWS_REGION"
            - |
              CREDS=$(aws sts assume-role-with-web-identity \
                --role-arn "$CI_ROLE_ARN" \
                --role-session-name "bb-build-${BITBUCKET_BUILD_NUMBER:-local}" \
                --web-identity-token "$BITBUCKET_STEP_OIDC_TOKEN" \
                --query Credentials --output json)
              export AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r .AccessKeyId)
              export AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r .SecretAccessKey)
              export AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r .SessionToken)
            - |
              ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
              REGISTRY="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
              IMAGE="${REGISTRY}/${PROJECT}-ci:latest"
              aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
              docker build -t "$IMAGE" -f ci/Dockerfile ci
              docker push "$IMAGE"
              echo "Pushed $IMAGE"

  # Every PR: read-only plan of both roots. Safe, no state mutation beyond reads.
  pull-requests:
    '**':
      - step: *plan

  branches:
    main:
      # 1) global applies automatically (low blast radius).
      - step:
          name: Apply global (ECR / Route53 / KMS)
          deployment: global
          oidc: true
          script:
            - bash ci/install-tools.sh
            - export AWS_REGION="$AWS_REGION" AWS_DEFAULT_REGION="$AWS_REGION"
            - |
              CREDS=$(aws sts assume-role-with-web-identity \
                --role-arn "$CI_ROLE_ARN" \
                --role-session-name "bb-${BITBUCKET_BUILD_NUMBER:-local}" \
                --web-identity-token "$BITBUCKET_STEP_OIDC_TOKEN" \
                --query Credentials --output json)
              export AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r .AccessKeyId)
              export AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r .SecretAccessKey)
              export AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r .SessionToken)
            - aws sts get-caller-identity
            - make -C infra-terraform init  PROJECT="$PROJECT" ROOT=global
            - make -C infra-terraform apply PROJECT="$PROJECT" ROOT=global AUTO=1 EXTRA='-var=aws_profile='

      # 2) shared (the cluster) is gated behind a manual click — high blast radius.
      #    `shared` reads global's state, so it always runs after step 1.
      - step:
          name: Apply shared (EKS cluster + ArgoCD)
          deployment: shared
          oidc: true
          trigger: automatic
          script:
            - bash ci/install-tools.sh
            - export AWS_REGION="$AWS_REGION" AWS_DEFAULT_REGION="$AWS_REGION"
            - |
              CREDS=$(aws sts assume-role-with-web-identity \
                --role-arn "$CI_ROLE_ARN" \
                --role-session-name "bb-${BITBUCKET_BUILD_NUMBER:-local}" \
                --web-identity-token "$BITBUCKET_STEP_OIDC_TOKEN" \
                --query Credentials --output json)
              export AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r .AccessKeyId)
              export AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r .SecretAccessKey)
              export AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r .SessionToken)
            - aws sts get-caller-identity
            # ArgoCD private-repo SSH key. Stored BASE64-ENCODED in the secured
            # var because Bitbucket flattens newlines in variables, which corrupts
            # the PEM key (ArgoCD then reports "ssh: no key found"). Decode here.
            # Empty -> no repo credential.
            - export TF_VAR_gitops_ssh_private_key="$(printf '%s' "${GITOPS_SSH_PRIVATE_KEY:-}" | base64 -d)"
            - make -C infra-terraform init  PROJECT="$PROJECT" ROOT=shared
            - make -C infra-terraform apply PROJECT="$PROJECT" ROOT=shared AUTO=1 EXTRA='-var=aws_profile='
