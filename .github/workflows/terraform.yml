name: Terraform infrastructure

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: Optional manually dispatched action
        required: true
        default: plan
        type: choice
        options:
          - plan
          - build-ci-image

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  PROJECT: ${{ vars.PROJECT }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VERSION: 1.9.8

jobs:
  ci:
    name: Reusable Terraform CI
    uses: ./.github/workflows/reusable-terraform-ci.yml
    with:
      project: ${{ vars.PROJECT }}
      aws_region: ${{ vars.AWS_REGION }}
      terraform_version: 1.9.8
      run_plan: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.action == 'plan') }}
    secrets: inherit

  apply-global:
    name: Apply global (ECR / Route53 / KMS)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    environment: global
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}-global
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Apply global
        run: |
          make -C infra-terraform init PROJECT="$PROJECT" ROOT=global
          make -C infra-terraform apply PROJECT="$PROJECT" ROOT=global AUTO=1 EXTRA='-var=aws_profile='

  apply-shared:
    name: Apply shared (EKS cluster + ArgoCD)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: apply-global
    runs-on: ubuntu-latest
    environment: shared
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}-shared
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Decode ArgoCD repository key
        env:
          GITOPS_SSH_PRIVATE_KEY_B64: ${{ secrets.GITOPS_SSH_PRIVATE_KEY }}
        run: |
          {
            echo 'TF_VAR_gitops_ssh_private_key<<GITOPS_SSH_PRIVATE_KEY_EOF'
            if [ -n "$GITOPS_SSH_PRIVATE_KEY_B64" ]; then
              printf '%s' "$GITOPS_SSH_PRIVATE_KEY_B64" | base64 --decode
            fi
            echo 'GITOPS_SSH_PRIVATE_KEY_EOF'
          } >> "$GITHUB_ENV"

      - name: Apply shared
        run: |
          make -C infra-terraform init PROJECT="$PROJECT" ROOT=shared
          make -C infra-terraform apply PROJECT="$PROJECT" ROOT=shared AUTO=1 EXTRA='-var=aws_profile='

  build-ci-image:
    name: Build and push CI image to ECR
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'build-ci-image'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}-build
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build and push image
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE="${REGISTRY}/${PROJECT}-ci:latest"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"
          docker build -t "$IMAGE" -f ci/Dockerfile ci
          docker push "$IMAGE"
          echo "Pushed $IMAGE"
